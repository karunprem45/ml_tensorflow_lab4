name: Notebook end-to-end run

# Runs the whole notebook top to bottom on the same Python version as Google Colab,
# so a broken cell is caught here instead of during grading.
on:
  push:
    branches: [main]
    paths:
      - "Lab4_TensorBoard.ipynb"
      - "lab_utils.py"
      - "requirements.txt"
      - ".github/workflows/notebook.yml"
  workflow_dispatch:

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt nbconvert ipykernel

      - name: Execute the notebook
        run: |
          jupyter nbconvert --to notebook --execute Lab4_TensorBoard.ipynb \
            --output executed.ipynb --ExecutePreprocessor.timeout=3600 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Check the results
        run: |
          python - <<'PY'
          import json, re
          nb = json.load(open("executed.ipynb"))
          text = ""
          for cell in nb["cells"]:
              for out in cell.get("outputs", []):
                  assert out.get("output_type") != "error", out
                  t = out.get("text") or out.get("data", {}).get("text/plain", "")
                  text += "".join(t)
          assert "Best config by CV macro F1" in text
          assert "Test macro F1" in text
          assert "final loss: nan" in text, "debugger run did not produce NaN"
          plain = re.sub(r"\x1b\[[0-9;]*m", "", text)  # drop pytest's colour codes
          assert re.search(r"\d+ passed", plain), "unit tests inside the notebook did not run"
          assert not re.search(r"\d+ (failed|error)", plain), "a unit test inside the notebook failed"
          m = re.search(r"Early stopping ended (\d+) of (\d+) runs", plain)
          assert m and int(m.group(1)) > 0, "early stopping never ended a run before the epoch limit"
          for line in plain.splitlines():
              if re.match(r"(Best config|Class weights,|Early stopping ended|Test macro F1|Test accuracy|final loss|=+ \d+ passed)", line):
                  print(line)
          PY

      - name: Upload executed notebook and TensorBoard logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: executed-notebook
          path: |
            executed.ipynb
            logs/
