name: Notebook end-to-end run

# Runs the whole notebook top to bottom on the same Python version as Google Colab,
# so a broken cell is caught here instead of during grading.
on:
  push:
    branches: [main]
    paths:
      - "Lab4_TensorBoard.ipynb"
      - "lab_utils.py"
      - "requirements.txt"
      - ".github/workflows/notebook.yml"
  workflow_dispatch:

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt nbconvert ipykernel

      - name: Execute the notebook
        run: |
          jupyter nbconvert --to notebook --execute Lab4_TensorBoard.ipynb \
            --output executed.ipynb --ExecutePreprocessor.timeout=3600 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Check the results
        run: |
          python - <<'PY'
          import json
          nb = json.load(open("executed.ipynb"))
          text = ""
          for cell in nb["cells"]:
              for out in cell.get("outputs", []):
                  assert out.get("output_type") != "error", out
                  t = out.get("text") or out.get("data", {}).get("text/plain", "")
                  text += "".join(t)
          assert "Best config by CV macro F1" in text
          assert "Test macro F1" in text
          assert "final loss: nan" in text, "debugger run did not produce NaN"
          assert "11 passed" in text, "unit tests inside the notebook did not all pass"
          for line in text.splitlines():
              if line.startswith(("Best config", "Test macro F1", "Test accuracy", "final loss")):
                  print(line)
          PY

      - name: Upload executed notebook and TensorBoard logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: executed-notebook
          path: |
            executed.ipynb
            logs/
